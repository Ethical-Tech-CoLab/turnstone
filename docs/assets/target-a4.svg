<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Turnstone object capture mat (A4)</title>
<desc>Print at 100% / Actual size, then MEASURE the scale bar and enter the measured value.</desc>

<!--
  TURNSTONE OBJECT CAPTURE MAT - A4

  GENERATED by tools/make-targets.mjs. Do not hand-edit: both page sizes come
  from the same geometry so they cannot drift apart, and tools/check-targets.mjs
  renders this file and measures the bar to confirm it is 180.00 mm.

  Units are millimetres. The viewBox is 210x297 and the page is declared
  210mm x 297mm, so one user unit is exactly one millimetre.

  WHAT EACH PART IS FOR:

  SCALE BAR. Satisfies scale-reference, and gives ground sample distance as
  measured-length divided by pixels-spanned - which needs no focal length, no
  sensor size and no distance, the three things a phone browser reports least
  reliably. The black ink spans exactly 180 mm; the end ticks are drawn
  inside the span so that what you measure is what is nominal.

  FIDUCIALS round the perimeter. The object sits in the middle, so as the camera
  orbits some markers stay unoccluded. A single marker in one corner disappears
  behind the object for a third of the orbit. The four glyphs differ from each
  other because identical markers give the matcher ambiguous correspondences.

  COLOUR PATCHES. Condition assessment depends on colour being comparable across
  captures years apart. Without a reference the record carries whatever cast the
  room lighting had, and a later capture cannot distinguish deterioration from a
  different set of light bulbs.
-->

<rect width="210" height="297" fill="#ffffff"/>

<text x="105" y="16" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="6.5" font-weight="bold" letter-spacing="0.8">TURNSTONE OBJECT CAPTURE MAT</text>
<text x="105" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#555">ethical-tech-colab.github.io/turnstone</text>

<rect x="20" y="26" width="170" height="13" fill="none" stroke="#000" stroke-width="0.5"/>
<text x="105" y="31.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3.6" font-weight="bold">PRINT AT 100% / "ACTUAL SIZE" - NOT "FIT TO PAGE"</text>
<text x="105" y="36.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3.2">Then measure the black bar below and enter what you actually measured.</text>

<g id="scale-bar" fill="#000">
  <rect x="15" y="52.5" width="20" height="7"/>
  <rect x="55" y="52.5" width="20" height="7"/>
  <rect x="95" y="52.5" width="20" height="7"/>
  <rect x="135" y="52.5" width="20" height="7"/>
  <rect x="175" y="52.5" width="20" height="7"/>
  <rect x="15" y="50" width="0.7" height="12"/>
  <rect x="194.3" y="50" width="0.7" height="12"/>
</g>
<rect x="15" y="52.5" width="180" height="7" fill="none" stroke="#000" stroke-width="0.25"/>
  <text x="15" y="66.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3">0</text>
  <text x="55" y="66.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3">40</text>
  <text x="95" y="66.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3">80</text>
  <text x="135" y="66.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3">120</text>
  <text x="175" y="66.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3">160</text>
<text x="105" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="4" font-weight="bold">MEASURE THIS - the full black bar, end to end</text>
<text x="105" y="71.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3.4">nominal 180.0 mm</text>

<g id="colour">
  <text x="15" y="82" font-family="Helvetica,Arial,sans-serif" font-size="3.4" font-weight="bold">COLOUR REFERENCE</text>
  <text x="70" y="82" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#555">so a capture years from now is comparable to this one</text>
  <rect x="15" y="85" width="20" height="14" fill="#ffffff" stroke="#000" stroke-width="0.3"/>
  <rect x="35" y="85" width="20" height="14" fill="#c0c0c0" stroke="#000" stroke-width="0.3"/>
  <rect x="55" y="85" width="20" height="14" fill="#808080" stroke="#000" stroke-width="0.3"/>
  <rect x="75" y="85" width="20" height="14" fill="#404040" stroke="#000" stroke-width="0.3"/>
  <rect x="95" y="85" width="20" height="14" fill="#000000" stroke="#000" stroke-width="0.3"/>
  <rect x="115" y="85" width="20" height="14" fill="#c8322d" stroke="#000" stroke-width="0.3"/>
  <rect x="135" y="85" width="20" height="14" fill="#2d8a3e" stroke="#000" stroke-width="0.3"/>
  <rect x="155" y="85" width="20" height="14" fill="#2b5fa8" stroke="#000" stroke-width="0.3"/>
  <rect x="175" y="85" width="20" height="14" fill="#d8a422" stroke="#000" stroke-width="0.3"/>
  <text x="25" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4">white</text>
  <text x="45" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4">75%</text>
  <text x="65" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4">50%</text>
  <text x="85" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4">25%</text>
  <text x="105" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4">black</text>
</g>

<g id="object-area">
  <rect x="45" y="112" width="120" height="120" fill="none" stroke="#999" stroke-width="0.4" stroke-dasharray="3 2"/>
  <text x="105" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5" fill="#aaa" letter-spacing="1.5">PLACE OBJECT HERE</text>
  <text x="105" y="177" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="#aaa">keep it inside the dashed square</text>

  <g fill="#000">
    <rect x="99" y="115" width="12" height="12"/>
    <rect x="102" y="118" width="6" height="6" fill="#fff"/>
    <circle cx="105" cy="221" r="6"/>
    <circle cx="105" cy="221" r="3" fill="#fff"/>
    <path d="M 51 172 l 12 -6 l 0 12 z"/>
    <path d="M 159 172 l 6 -6 l 6 6 l -6 6 z"/>
  </g>

  <g stroke="#000" stroke-width="0.8" fill="none">
    <path d="M 45 120 L 45 112 L 53 112"/>
    <path d="M 157 112 L 165 112 L 165 120"/>
    <path d="M 165 224 L 165 232 L 157 232"/>
    <path d="M 53 232 L 45 232 L 45 224"/>
  </g>
  <text x="105" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="#777">corner to corner: 120.0 mm nominal</text>
</g>

<g id="record">
  <rect x="15" y="246" width="180" height="34" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="20" y="253" font-family="Helvetica,Arial,sans-serif" font-size="3.4" font-weight="bold">WRITE THIS ON THE CARD ONCE, THEN REUSE IT</text>

  <text x="20" y="262" font-family="Helvetica,Arial,sans-serif" font-size="3">MEASURED BAR LENGTH</text>
  <line x1="72" y1="263" x2="105" y2="263" stroke="#000" stroke-width="0.3"/>
  <text x="107" y="262" font-family="Helvetica,Arial,sans-serif" font-size="3">mm</text>

  <text x="120" y="262" font-family="Helvetica,Arial,sans-serif" font-size="3">CARD ID</text>
  <line x1="139" y1="263" x2="190" y2="263" stroke="#000" stroke-width="0.3"/>

  <text x="20" y="271" font-family="Helvetica,Arial,sans-serif" font-size="3">DATE MEASURED</text>
  <line x1="60" y1="272" x2="105" y2="272" stroke="#000" stroke-width="0.3"/>

  <text x="120" y="271" font-family="Helvetica,Arial,sans-serif" font-size="3">MEASURED BY</text>
  <line x1="152" y1="272" x2="190" y2="272" stroke="#000" stroke-width="0.3"/>

  <text x="20" y="278" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#555">Enter the MEASURED length in the app, not the nominal one. A page scaled to 96% makes every measurement 4% wrong.</text>
</g>

<text x="105" y="283" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="#777">Keep the mat flat and unfolded. A creased mat is no longer a straight line of known length.</text>
<text x="105" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="#999">CC0 - copy, print and modify freely</text>

</svg>
