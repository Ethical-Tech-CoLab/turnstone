<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Turnstone">
  <title>Turnstone</title>
  <rect width="512" height="512" rx="96" fill="#0d1117"/>

  <!--
    The coverage dial, which is the app's central idea: the viewing sphere cut
    into sectors, most of them visited and one gap still to fill. A logo that
    shows what the tool is for beats a logo that shows a bird.
  -->
  <g transform="translate(256 256)">
    <g fill="#00e5ff">
      <!-- 24 sectors, with a gap left open at the top right. -->
      <g id="ring">
        <path d="M -14 -168 A 168 168 0 0 1 14 -168 L 12 -120 A 120 120 0 0 0 -12 -120 Z"/>
      </g>
      <use href="#ring" transform="rotate(15)"/>
      <use href="#ring" transform="rotate(30)"/>
      <use href="#ring" transform="rotate(105)"/>
      <use href="#ring" transform="rotate(120)"/>
      <use href="#ring" transform="rotate(135)"/>
      <use href="#ring" transform="rotate(150)"/>
      <use href="#ring" transform="rotate(165)"/>
      <use href="#ring" transform="rotate(180)"/>
      <use href="#ring" transform="rotate(195)"/>
      <use href="#ring" transform="rotate(210)"/>
      <use href="#ring" transform="rotate(225)"/>
      <use href="#ring" transform="rotate(240)"/>
      <use href="#ring" transform="rotate(255)"/>
      <use href="#ring" transform="rotate(270)"/>
      <use href="#ring" transform="rotate(285)"/>
      <use href="#ring" transform="rotate(300)"/>
      <use href="#ring" transform="rotate(315)"/>
      <use href="#ring" transform="rotate(330)"/>
      <use href="#ring" transform="rotate(345)"/>
    </g>

    <!-- The unfilled sectors: the gap you still have to walk to. -->
    <g fill="#30363d">
      <use href="#ring" transform="rotate(45)"/>
      <use href="#ring" transform="rotate(60)"/>
      <use href="#ring" transform="rotate(75)"/>
    </g>

    <!-- The object at the centre. -->
    <circle r="62" fill="#161b22" stroke="#30363d" stroke-width="6"/>
    <circle r="26" fill="#00e5ff" opacity="0.9"/>
  </g>
</svg>
